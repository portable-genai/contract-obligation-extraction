name: Demo gate

# Practices check F2: the demo cannot rot silently.
#
# A demo that is only ever run by hand before a meeting is a demo that breaks in the meeting. So
# the SAME script the presenter drives runs here, unattended and headless, asserting every step:
# if a claim the narration makes stops being true, this job goes red on the commit that broke it
# rather than in front of a client.
#
# It is a separate workflow from the hard gate on purpose. `make gate` proves the SERVICE and
# must stay fast and offline; this proves the STORY, which is a different job with a different
# failure mode. Both are required checks; neither hides inside the other.
#
# It also lints `scripts/` and `eval/`, which the shared reusable hard gate does not cover (it
# runs `ruff check src tests`). Without this step the demo surface would be the one part of the
# repo whose formatting drifts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: demo-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    name: demo self-test + portability + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Lint the demo surface
        run: |
          ruff check scripts eval
          ruff format --check scripts eval

      # Headless and unattended, with a hard assertion behind every step. No browser engine is
      # installed and none is needed: the walkthrough drives the demo server over loopback HTTP.
      - name: Demo self-test
        run: make demo-selftest

      - name: Portability seam tour
        run: make portability

      - name: Static render (the screenshots path stays working too)
        run: make demo-static

      - name: Documentation checks
        run: make docs-check
