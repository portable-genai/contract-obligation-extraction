name: UI gate

# The npm half of the gate. It is a REPO-LOCAL workflow rather than part of the shared reusable
# hard gate because the shared gate is Python-only and most catalog repos have no `ui/` at all.
#
# Every step is guarded by a presence check on `ui/package.json`, evaluated after checkout. That
# is deliberate: `hashFiles()` in a job-level `if` is evaluated before the workspace exists, so a
# guard written that way would be a guard that never guards. With this shape the workflow is
# correct both for a repo that keeps `ui/` and for one that ran `make drop-ui`, and it needs no
# edit either way.
#
# `npm audit --audit-level=high` is a HARD failure, matching the Python side, where `pip-audit`
# fails the supply-chain job rather than warning. A dependency advisory that only prints is an
# advisory nobody reads.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ui-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: tsc + node tests + build + npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Detect the UI
        id: detect
        run: |
          if [ -f ui/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no ui/ in this repo; nothing to gate"
          fi

      - name: Set up Node 22
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `npm ci` and not `npm install`: the committed lockfile is authoritative, exactly as the
      # Python lockfiles are. `npm install` would silently resolve something else.
      - name: Install (locked)
        if: steps.detect.outputs.present == 'true'
        run: npm ci --prefix ui

      - name: Type-check
        if: steps.detect.outputs.present == 'true'
        run: npm --prefix ui run lint

      - name: Policy tests
        if: steps.detect.outputs.present == 'true'
        run: npm --prefix ui test

      - name: Production build
        if: steps.detect.outputs.present == 'true'
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm --prefix ui run build

      # The only check that proves the built page can HYDRATE. Everything above it passed while
      # the shipped console was dead markup: the CSP string was right, tsc was clean, the build
      # succeeded and the page rendered, but every script tag was blocked and React never
      # attached. This starts the server that was just built and asserts the served markup and the
      # served header agree about the nonce.
      - name: Prove the built page hydrates
        if: steps.detect.outputs.present == 'true'
        run: npm --prefix ui run assert-hydratable

      - name: npm audit (high severity fails the build)
        if: steps.detect.outputs.present == 'true'
        run: npm audit --audit-level=high --prefix ui
